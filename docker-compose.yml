services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema/mysql:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7.0
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  neo4j_data:
